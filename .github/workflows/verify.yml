name: Verify backend release

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

concurrency:
  group: verify-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Test backend
        run: npm test
        working-directory: backend
      - name: Validate Vercel entry point
        run: npm run check:vercel
        working-directory: backend
